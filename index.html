<style>

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

.app{display:flex;min-height:100vh}
.sidebar{width:210px;flex:none;position:sticky;top:0;height:100vh;padding:24px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--surface)}

.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.mlogo{display:none}

.cover{position:relative}

.bar{height:3px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}

.empty{grid-column:1/-1;color:var(--text-2);padding:30px 0}
