name: Deploy PANEL Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/worker.js"
      - "cloudflare/wrangler.toml"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: panel-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PANEL
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
            exit 1
          fi

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy

      - name: Verify Worker health
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "https://royal-violet-a780.galroland0826.workers.dev/health" | grep -q '"ok":true'; then
              echo "Worker health check passed"
              exit 0
            fi
            sleep 8
          done
          echo "::error::Worker health check failed"
          exit 1
